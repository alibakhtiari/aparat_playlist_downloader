name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows-amd64
            ext: .exe
            data_sep: ";"
          - os: ubuntu-22.04
            platform_name: linux-amd64
            ext: ""
            data_sep: ":"
          - os: macos-14
            platform_name: macos-arm64
            ext: ""
            data_sep: ":"
          - os: macos-13
            platform_name: macos-x86_64
            ext: ""
            data_sep: ":"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Prepare Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; img = Image.open('download-icon.png'); img.save('download-icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Build CLI Executable
        shell: bash
        run: |
          pyinstaller --onefile --clean \
            --name "aparat-dl-${{ matrix.platform_name }}" \
            cli.py

      - name: Build GUI Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --clean `
            --icon "download-icon.ico" `
            --add-data "download-icon.png;." `
            --name "aparat-gui-${{ matrix.platform_name }}" `
            gui.py

      - name: Build GUI Executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --onefile --clean \
            --add-data "download-icon.png:." \
            --name "aparat-gui-${{ matrix.platform_name }}" \
            gui.py

      - name: Build GUI Executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --clean \
            --add-data "download-icon.png:." \
            --name "aparat-gui-${{ matrix.platform_name }}" \
            gui.py
          if [ -d "dist/aparat-gui-${{ matrix.platform_name }}.app" ]; then
            cd dist
            zip -r "aparat-gui-${{ matrix.platform_name }}.app.zip" "aparat-gui-${{ matrix.platform_name }}.app"
            cd ..
          fi

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp dist/aparat-dl-${{ matrix.platform_name }}${{ matrix.ext }} staging/
          if [ -f "dist/aparat-gui-${{ matrix.platform_name }}${{ matrix.ext }}" ]; then
            cp dist/aparat-gui-${{ matrix.platform_name }}${{ matrix.ext }} staging/
          fi
          if [ -f "dist/aparat-gui-${{ matrix.platform_name }}.app.zip" ]; then
            cp dist/aparat-gui-${{ matrix.platform_name }}.app.zip staging/
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform_name }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
