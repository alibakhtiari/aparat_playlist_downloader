[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aparat-playlist-downloader"
version = "1.0.0"
description = "A modern CLI & GUI downloader for Aparat videos and playlists"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ali Bakhtiari", email = "ali.bakhtiarii@gmail.com"}
]
dependencies = [
    "requests>=2.28.0",
    "PyQt5>=5.15.10",
]

[project.scripts]
aparat-dl = "cli:main"
aparat-gui = "gui:main"

[tool.setuptools]
py-modules = ["core", "cli", "gui"]
